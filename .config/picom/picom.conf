## 2026-08-16 SARBS
# Optimiert für DWM (picom v13, extra/picom)
# Migriert von picom-ftlabs-git:
#   - Animationen: neues Script-System (Presets + Trigger)
#   - Fenster-Regeln: neues "rules"-System (opacity-rule, corner-radius-rules,
#     rounded-corners-exclude und wintypes sind in v13 deprecated bzw. werden
#     ignoriert, sobald "rules" gesetzt ist)
#
# Wichtige Befehle:
# 'xprop | grep WM_CLASS'   # zeigt die class_g eines Fensters
# 'picom --diagnostics'     # zeigt alle aktiven Regeln
# 'picom -b'                # startet picom deamon

#######################################
#  Basis-Einstellungen                #
#######################################

# Schatten
shadow = true;

# Fading aktiviert - steuert Opacity-Übergänge (z.B. Fokus-Wechsel)
fading = true;
fade-in-step = 0.10;              # Einblend-Geschwindigkeit (0.01-1.0, höher = schneller)
fade-out-step = 0.10;             # Ausblend-Geschwindigkeit (0.01-1.0, höher = schneller)
fade-delta = 5;                   # Zeit zwischen Fade-Schritten in ms

# Runde Ecken - Hauptfeature
corner-radius = 15;

#######################################
#  Animationen (picom v13)            #
#######################################
#
# Seit picom v13 werden Animationen als Scripte mit Triggern und Presets
# definiert. Die alten ftlabs-Optionen (animation-for-open-window,
# animation-stiffness-*, animation-window-mass, enable-fading-*-tag, ...)
# existieren nicht mehr.
#
# Verfügbare Presets:
#   appear / disappear   - Skalieren + Faden (entspricht ftlabs zoom/maximize/minimize)
#   slide-in / slide-out - Ein-/Ausgleiten (Richtung: up, down, left, right)
#   fly-in / fly-out     - Ein-/Ausfliegen (Richtung: up, down, left, right)
#   geometry-change      - Größen-/Positionsänderungen animieren (experimentell)
#
# Verfügbare Trigger:
#   open   - Fenster wird geöffnet                 (ftlabs: animation-for-open-window)
#   close  - Fenster wird geschlossen               (ftlabs: animation-for-unmap-window)
#   show   - Fenster erscheint, z.B. Tag-Wechsel    (ftlabs: animation-for-next-tag)
#   hide   - Fenster verschwindet, z.B. Tag-Wechsel (ftlabs: animation-for-prev-tag)
#
# Mapping der alten Einstellungen:
#   animation-for-open-window = "zoom"          -> open:  appear
#   animation-for-unmap-window = "minimize"     -> close: disappear
#   animation-for-prev-tag = "minimize"         -> hide:  disappear
#   animation-for-next-tag = "slide-in-center"  -> show:  slide-in von oben

animations = ({
    # Fenster öffnen: zoom aus dem Zentrum des Fensters
    triggers = [ "open" ];
    preset = "appear";
    scale = 0.3;                  # Startgröße (0.5 = beginnt bei halber Größe)
    duration = 0.1;               # Dauer in Sekunden
}, {
    # Fenster schließen bzw. verlässt den Tag (dwm unmappt es):
    # schrumpfen zur Mitte + ausblenden
    triggers = [ "close", "hide" ];
    preset = "disappear";
    scale = 0.3;
    duration = 0.1;
}, {
    # Fenster erscheint auf neuem Tag: von oben eingleiten
    triggers = [ "show" ];
    preset = "slide-in";
    direction = "up";
    duration = 0.1;
});

# TUNING-TIPPS:
# - Zu langsam?       -> duration senken (z.B. 0.2)
# - Zu hektisch?      -> duration erhöhen (z.B. 0.5)
# - Zoom zu dezent?   -> scale bei appear/disappear senken (z.B. 0.3)
# - Anderer Stil?     -> preset = "fly-in" / "slide-out", direction anpassen

#######################################
# BLURRING - Komplett deaktiviert     #
#######################################
# Methoden: none, gaussian, box, kernel, dual_kawase
blur:
{
  method = "none";
};

# Alle blur-Einstellungen deaktiviert um RAM zu sparen
blur-background = false;
blur-background-fixed = false;

#######################################
#     Backend & Performance           #
#######################################

# Backend auswählen: `xrender` oder `glx`
# (Die Option `egl` wurde in v13 entfernt; glx nutzt automatisch EGL,
#  wenn verfügbar)
#   xrender - Software-Rendering, langsamer aber stabil (für VMs empfohlen)
#   glx     - OpenGL-basiert, beste Performance auf echter Hardware
# WICHTIG: glx wird für flüssige Animationen benötigt!
backend = "glx";

# Performance-Einstellungen
vsync = true;                         # VSync aktivieren (verhindert Tearing)
use-damage = true;                    # Nur geänderte Bereiche neu rendern
unredir-if-possible = true;           # Compositor bei Vollbild-Apps umgehen (spart RAM)
detect-transient = true;
transparent-clipping = false;
# glx-no-stencil ist in v13 deprecated und wurde entfernt
log-level = "warn";

#######################################
#  Fenster-Regeln (picom v13)         #
#######################################
# Neues "rules"-System: Regeln werden in Reihenfolge ausgewertet, bei mehreren
# Treffern gewinnt die ZULETZT gesetzte Option (früher: erster Treffer gewann).
# Deshalb: allgemeine Regeln zuerst, spezifische danach.
#
# Ersetzt: wintypes, opacity-rule, corner-radius-rules, rounded-corners-exclude

rules = ({
    # --- Fenstertypen (ehemals wintypes) ---
    match = "window_type = 'tooltip'";
    fade = true;
    shadow = false;
    opacity = 0.85;
}, {
    match = "window_type = 'dock' || window_type = 'dnd'";
    shadow = false;
}, {
    match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    opacity = 0.90;
}, {
    # --- Opacity (ehemals opacity-rule, Werte jetzt 0.0-1.0) ---
    # Dmenu & Rofi - leichte Transparenz für Launcher
    match = "class_g = 'dmenu' || class_g = 'Rofi' || class_g = 'rofi'";
    opacity = 0.95;
}, {
    # SARBS Terminal-Transparenz (WHITELIST-Ansatz)
    # Nur spezifische Terminal-Emulatoren bekommen Transparenz bei Inaktivität
    # Alle anderen Apps (Browser, GUI-Tools, etc.) bleiben 100% opacity
    match = "(class_g = 'St' || class_g = 'st' || class_g = 'st-256color' || "
            "class_g = 'Alacritty' || class_g = 'alacritty' || "
            "class_g = 'kitty' || class_g = 'Kitty' || "
            "class_g = 'URxvt' || class_g = 'urxvt' || "
            "class_g = 'XTerm' || class_g = 'xterm' || "
            "class_g = 'termite' || class_g = 'Termite') && !focused";
    opacity = 0.85;
}, {
    # Dunst - leichte Transparenz für Benachrichtigungen
    # TODO Dunst regeln funktionieren nicht
    match = "class_g = 'Dunst' || class_g = 'dunst'";
    opacity = 0.85;
}, {
    # SARBS HUD - eigenes Qutebrowser-Fenster mit Transparenz
    match = "name = 'sarbs-hud - qutebrowser'";
    opacity = 0.95;
}, {
    # DWM Statusbar & Docks - immer 100% sichtbar
    match = "class_g = 'dwmbar' || window_type = 'dock'";
    opacity = 1.0;
}, {
    # Vollbild-Apps immer 100%
    match = "fullscreen";
    opacity = 1.0;
}, {
    # --- Runde Ecken (ehemals rounded-corners-exclude + corner-radius-rules) ---
    # Blacklist zuerst, spezifische Regeln danach (überschreiben die Blacklist)
    match = "window_type = 'desktop' || window_type = 'dock' || class_g = 'mpv'";
    corner-radius = 0;
}, {
    match = "name = 'webcam'";
    corner-radius = 80;
}, {
    match = "class_g = 'dwmbar'";
    corner-radius = 7;
}, {
    match = "class_g = 'dmenu'";
    corner-radius = 0;
}, {
    match = "class_g = 'Rofi'";
    corner-radius = 20;
}, {
    match = "class_g = 'Dunst'";
    corner-radius = 10;
}, {
    # --- Animationen für Popup/Dialog-Fenster (z.B. dmenu, Tooltips) ---
    # (entspricht animation-for-transient-window = "maximize")
    match = "WM_TRANSIENT_FOR@";
    animations = ({
        triggers = [ "open" ];
        preset = "appear";
        scale = 0.8;
        duration = 0.2;
    });
});
