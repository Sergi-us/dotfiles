# Yazi Hauptkonfiguration
# Schema-Validierung: https://yazi-rs.github.io/schemas/yazi.json

## 2025-01-09 SARBS

# ============================================================================
# DATEIMANAGER (mgr) - Grundeinstellungen für die Dateianzeige
# ============================================================================
[mgr]
# Spaltenverhältnis: Links (Verzeichnisbaum) | Mitte (Dateiliste) | Rechts (Vorschau)
ratio          = [ 1, 3, 5 ]
# Standardsortierung
sort_by        = "alphabetical"      # Sortierkriterium: alphabetical, natural, size, mtime, btime, extension, random
sort_sensitive = false               # Groß-/Kleinschreibung bei Sortierung beachten
sort_reverse   = false               # Sortierung umkehren
sort_dir_first = true                # Verzeichnisse zuerst anzeigen
sort_translit  = false               # Transliteration bei Sortierung (z.B. é -> e)
sort_fallback  = "alphabetical"      # Fallback-Sortierung bei gleichen Kriterien
linemode       = "none"              # Zeilenmodus: none, size, permissions, btime, mtime, owner
show_hidden    = false               # Versteckte Dateien anzeigen (beginnen mit .)
show_symlink   = true                # Symlink-Ziele anzeigen
scrolloff      = 5                   # Zeilen Puffer beim Scrollen am Rand
mouse_events   = [ "click", "scroll", "drag" ]  # Aktivierte Mausaktionen

# ============================================================================
# VORSCHAU (preview) - Einstellungen für die Dateivorschau
# ============================================================================
[preview]
wrap            = "no"               # Textumbruch in Vorschau: no, yes, wrap
tab_size        = 2                  # Tabulator-Breite in Vorschau
max_width       = 600                # Maximale Breite der Vorschau in Pixeln
max_height      = 900                # Maximale Höhe der Vorschau in Pixeln
cache_dir       = ""                 # Cache-Verzeichnis für Vorschaubilder (leer = Standard)
image_delay     = 30                 # Verzögerung für Bildanimationen in ms
image_filter    = "triangle"         # Bildfilter: triangle, catmull_rom, lanczos3, gaussian
image_quality   = 75                 # Bildqualität für komprimierte Vorschauen (0-100)
ueberzug_scale  = 1                  # Skalierung für Ueberzug-Bildanzeige
ueberzug_offset = [ 0, 0, 0, 0 ]     # Offset für Ueberzug [links, oben, rechts, unten]

# ============================================================================
# ÖFFNER (opener) - Programme zum Öffnen von Dateien
# ============================================================================
[opener]
# Bearbeiten mit Texteditor
edit = [
	{ run = "${EDITOR:-vi} %s", desc = "$EDITOR",      for = "unix", block = true },
	{ run = "code %s",          desc = "code",         for = "windows", orphan = true },
	{ run = "code -w %s",       desc = "code (block)", for = "windows", block = true },
]
# Abspielen von Medien
play = [
	{ run = "xdg-open %s1",    desc = "Play", for = "linux", orphan = true },
	{ run = "open %s",         desc = "Play", for = "macos" },
	{ run = 'start "" %s1',    desc = "Play", for = "windows", orphan = true },
	{ run = "termux-open %s1", desc = "Play", for = "android" },
	{ run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
	{ run = "mediainfo %s1 & pause", block = true, desc = "Show media info", for = "windows" },
]
# Öffnen mit Standardprogramm
open = [
	{ run = "xdg-open %s1",    desc = "Open", for = "linux" },
	{ run = "open %s",         desc = "Open", for = "macos" },
	{ run = 'start "" %s1',    desc = "Open", for = "windows", orphan = true },
	{ run = "termux-open %s1", desc = "Open", for = "android" },
]
# Ordner im Dateimanager anzeigen
reveal = [
	{ run = "xdg-open %d1",         desc = "Reveal", for = "linux" },
	{ run = "open -R %s1",          desc = "Reveal", for = "macos" },
	{ run = "explorer /select,%s1", desc = "Reveal", for = "windows", orphan = true },
	{ run = "termux-open %d1",      desc = "Reveal", for = "android" },
	{ run = "clear; exiftool %s1; echo 'Press enter to exit'; read _", desc = "Show EXIF", for = "unix", block = true },
]
# Archive entpacken
extract = [
	{ run = "ya pub extract --list %s", desc = "Extract here" },
]
# Downloads
download = [
	{ run = "ya emit download --open %S", desc = "Download and open" },
	{ run = "ya emit download %S",        desc = "Download" },
]

# ============================================================================
# ÖFFNUNGSREGELN (open) - Welche Öffner für welche Dateitypen
# ============================================================================
[open]
rules = [
	# Verzeichnisse
	{ url = "*/", use = [ "edit", "open", "reveal" ] },
	# Textdateien
	{ mime = "text/*", use = [ "edit", "reveal" ] },
	# Bilder
	{ mime = "image/*", use = [ "open", "reveal" ] },
	# Audio/Video
	{ mime = "{audio,video}/*", use = [ "play", "reveal" ] },
	# Code-Dateien (JSON, JavaScript, etc.)
	{ mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [ "edit", "reveal" ] },
	# Archive (ZIP, TAR, etc.)
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
	# Leere Dateien
	{ mime = "inode/empty", use = [ "edit", "reveal" ] },
	# Virtuelle Dateisysteme
	{ mime = "vfs/{absent,stale}", use = "download" },
	# Fallback für alle anderen Dateien
	{ url = "*", use = [ "open", "reveal" ] },
]

# ============================================================================
# AUFGABEN (tasks) - Hintergrundprozesse und Worker
# ============================================================================
[tasks]
file_workers     = 3          # Anzahl gleichzeitiger Datei-Operationen
plugin_workers   = 5          # Anzahl gleichzeitiger Plugin-Operationen
fetch_workers    = 5          # Anzahl gleichzeitiger Fetch-Operationen
preload_workers  = 2          # Anzahl gleichzeitiger Preload-Operationen
process_workers  = 5          # Anzahl gleichzeitiger Prozess-Operationen
bizarre_retry    = 3          # Wiederholungsversuche bei Fehlern
image_alloc      = 536870912  # Maximaler Speicher für Bilder (512MB)
image_bound      = [ 10000, 10000 ]  # Maximale Bildabmessungen [Breite, Höhe]
suppress_preload = false      # Preload unterdrücken

# ============================================================================
# PLUGINS (plugin) - Plugin-Konfiguration für Datei-Erkennung und Vorschau
# ============================================================================
[plugin]
# Fetcher: Ermitteln Datei-Metadaten
fetchers = [
	# MIME-Typ-Erkennung
	{ url = "*/",         run = "mime.dir",    prio = "high", group = "mime" },
	{ url = "local://*",  run = "mime.local",  prio = "high", group = "mime" },
	{ url = "remote://*", run = "mime.remote", prio = "high", group = "mime" },
]
# Spotters: Erkennen, wie Dateien angezeigt werden sollen
spotters = [
	# Mehrfachauswahl
	{ mime = "multi/*", run = "multi" },
	# Verzeichnisse
	{ url = "*/", run = "folder" },
	# Code-Dateien
	{ mime = "text/*", run = "code" },
	{ mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
	# Bilder (spezielle Formate)
	{ mime = "image/{avif,hei?,jxl}", run = "magick" },
	{ mime = "image/svg+xml", run = "svg" },
	{ mime = "image/*", run = "image" },
	# Videos
	{ mime = "video/*", run = "video" },
	# Virtuelle Dateisysteme
	{ mime = "vfs/*", run = "vfs" },
	# Fehler/Null-Dateien
	{ mime = "null/*", run = "null" },
	# Fallback
	{ url = "*", run = "file" },
]
# Preloader: Dateien im Voraus laden für schnellere Vorschau
preloaders = [
	# Bilder
	{ mime = "image/{avif,hei?,jxl}", run = "magick" },
	{ mime = "image/svg+xml", run = "svg" },
	{ mime = "image/*", run = "image" },
	# Videos
	{ mime = "video/*", run = "video" },
	# PDF-Dokumente
	{ mime = "application/pdf", run = "pdf" },
	# Schriftarten
	{ mime = "font/*", run = "font" },
	{ mime = "application/ms-opentype", run = "font" },
]
# Previewer: Tatsächliche Vorschau-Anzeige
previewers = [
	# Verzeichnisse
	{ url = "*/", run = "folder" },
	# Code-Dateien
	{ mime = "text/*", run = "code" },
	{ mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
	# JSON-Dateien
	{ mime = "application/{json,ndjson}", run = "json" },
	# Bilder
	{ mime = "image/{avif,hei?,jxl}", run = "magick" },
	{ mime = "image/svg+xml", run = "svg" },
	{ mime = "image/*", run = "image" },
	# Videos
	{ mime = "video/*", run = "video" },
	# PDF-Dokumente
	{ mime = "application/pdf", run = "pdf" },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = "archive" },
	{ mime = "application/{debian*-package,redhat-package-manager,rpm,android.package-archive}", run = "archive" },
	{ url = "*.{AppImage,appimage}", run = "archive" },
	# Virtuelle Festplatten / Disk-Images
	{ mime = "application/{iso9660-image,qemu-disk,ms-wim,apple-diskimage}", run = "archive" },
	{ mime = "application/virtualbox-{vhd,vhdx}", run = "archive" },
	{ url = "*.{img,fat,ext,ext2,ext3,ext4,squashfs,ntfs,hfs,hfsx}", run = "archive" },
	# Schriftarten
	{ mime = "font/*", run = "font" },
	{ mime = "application/ms-opentype", run = "font" },
	# Leere Dateien
	{ mime = "inode/empty", run = "empty" },
	# Virtuelle Dateisysteme
	{ mime = "vfs/*", run = "vfs" },
	# Fehler/Null-Dateien
	{ mime = "null/*", run = "null" },
	# Fallback
	{ url = "*", run = "file" },
]

# ============================================================================
# EINGABE (input) - Dialoge für Benutzereingaben
# ============================================================================
[input]
cursor_blink = true      # Blinkender Cursor

# Verzeichnis wechseln
cd_title  = "Change directory:"
cd_origin = "top-center"
cd_offset = [ 0, 2, 50, 3 ]

# Datei/Verzeichnis erstellen
create_title  = [ "Create:", "Create (dir):" ]
create_origin = "top-center"
create_offset = [ 0, 2, 50, 3 ]

# Umbenennen
rename_title  = "Rename:"
rename_origin = "hovered"
rename_offset = [ 0, 1, 50, 3 ]

# Filtern
filter_title  = "Filter:"
filter_origin = "top-center"
filter_offset = [ 0, 2, 50, 3 ]

# Suchen
find_title  = [ "Find next:", "Find previous:" ]
find_origin = "top-center"
find_offset = [ 0, 2, 50, 3 ]

# Suche (extern)
search_title  = "Search via {n}:"
search_origin = "top-center"
search_offset = [ 0, 2, 50, 3 ]

# Shell-Befehl
shell_title  = [ "Shell:", "Shell (block):" ]
shell_origin = "top-center"
shell_offset = [ 0, 2, 50, 3 ]

# ============================================================================
# BESTÄTIGUNG (confirm) - Bestätigungsdialoge
# ============================================================================
[confirm]
# In Papierkorb verschieben
trash_title 	= "Trash {n} selected file{s}?"
trash_origin	= "center"
trash_offset	= [ 0, 0, 70, 20 ]

# Endgültig löschen
delete_title 	= "Permanently delete {n} selected file{s}?"
delete_origin	= "center"
delete_offset	= [ 0, 0, 70, 20 ]

# Überschreiben
overwrite_title  = "Overwrite file?"
overwrite_body   = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [ 0, 0, 50, 15 ]

# Beenden
quit_title  = "Quit?"
quit_body   = "There are unfinished tasks, quit anyway?\n(Open task manager with default key 'w')"
quit_origin = "center"
quit_offset = [ 0, 0, 50, 15 ]

# ============================================================================
# AUSWAHL (pick) - Auswahl-Dialoge
# ============================================================================
[pick]
open_title  = "Open with:"
open_origin = "hovered"
open_offset = [ 0, 1, 50, 7 ]

# ============================================================================
# TASTENKÜRZEL-SORTIERUNG (which) - Sortierung der Which-Dialoge
# ============================================================================
[which]
sort_by      	 = "none"
sort_sensitive = false
sort_reverse 	 = false
sort_translit  = false
