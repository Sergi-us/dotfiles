# Yazi Tastenbelegung
# Schema-Validierung: https://yazi-rs.github.io/schemas/keymap.json

## 2025-01-09 SARBS

# ============================================================================
# DATEIMANAGER (mgr) - Haupt-Tastenbelegung
# ============================================================================
[mgr]

keymap = [
	# --- Allgemein ---
	{ on = "<Esc>", run = "escape",             desc = "Visuellen Modus verlassen, Auswahl löschen oder Suche abbrechen" },
	{ on = "q",     run = "quit",               desc = "Yazi beenden" },
# verlassen in aktuellen verzeichniss
	{ on = "Q",     run = "quit --no-cwd-file", desc = "Beenden ohne aktuelles Verzeichnis auszugeben" },
	{ on = "<C-c>", run = "close",              desc = "Aktuellen Tab schließen oder Yazi beenden (wenn letzter Tab)" },
	{ on = "<C-z>", run = "suspend",            desc = "Yazi suspendieren (in Hintergrund)" },

	# --- Navigation (Hoch/Runter) ---
	{ on = "k", run = "arrow prev", desc = "Vorherige Datei" },
	{ on = "j", run = "arrow next", desc = "Nächste Datei" },

	{ on = "<Up>",   run = "arrow prev", desc = "Vorherige Datei" },
	{ on = "<Down>", run = "arrow next", desc = "Nächste Datei" },

	# --- Seitenweises Scrollen ---
	{ on = "<C-u>", run = "arrow -50%",  desc = "Halbe Seite hoch scrollen" },
	{ on = "<C-d>", run = "arrow 50%",   desc = "Halbe Seite runter scrollen" },
	{ on = "<C-b>", run = "arrow -100%", desc = "Ganze Seite hoch scrollen" },
	{ on = "<C-f>", run = "arrow 100%",  desc = "Ganze Seite runter scrollen" },

	{ on = "<S-PageUp>",   run = "arrow -50%",  desc = "Halbe Seite hoch scrollen" },
	{ on = "<S-PageDown>", run = "arrow 50%",   desc = "Halbe Seite runter scrollen" },
	{ on = "<PageUp>",     run = "arrow -100%", desc = "Ganze Seite hoch scrollen" },
	{ on = "<PageDown>",   run = "arrow 100%",  desc = "Ganze Seite runter scrollen" },

	# --- Zum Anfang/Ende springen ---
	{ on = [ "g", "g" ], run = "arrow top", desc = "Zum Anfang springen" },
	{ on = "G",          run = "arrow bot", desc = "Zum Ende springen" },

	# --- Verzeichnis-Navigation (Links/Rechts) ---
	{ on = "h", run = "leave", desc = "Zurück zum übergeordneten Verzeichnis" },
	{ on = "l", run = "enter", desc = "In Unterverzeichnis wechseln" },

	{ on = "<Left>",  run = "leave", desc = "Zurück zum übergeordneten Verzeichnis" },
	{ on = "<Right>", run = "enter", desc = "In Unterverzeichnis wechseln" },

	# --- Verlaufs-Navigation ---
	{ on = "H", run = "back",    desc = "Zurück zum vorherigen Verzeichnis (Verlauf)" },
# H ins Home verzeichniss springen
	{ on = "L", run = "forward", desc = "Vorwärts zum nächsten Verzeichnis (Verlauf)" },

	# --- Auswahl (Toggle) ---
	{ on = "<Space>", run = [ "toggle", "arrow 1" ], desc = "Aktuelle Datei auswählen/abwählen und eine Zeile weiter" },
	{ on = "<C-a>",   run = "toggle_all --state=on", desc = "Alle Dateien auswählen" },
	{ on = "<C-r>",   run = "toggle_all",            desc = "Auswahl umkehren (alle auswählen/abwählen)" },

	# --- Visueller Modus ---
	{ on = "v", run = "visual_mode",         desc = "Visuellen Modus starten (Auswahl-Modus)" },
	{ on = "V", run = "visual_mode --unset", desc = "Visuellen Modus starten (Abwahl-Modus)" },

	# --- Vorschau scrollen ---
	{ on = "K", run = "seek -5", desc = "Vorschau 5 Zeilen hoch scrollen" },
	{ on = "J", run = "seek 5",  desc = "Vorschau 5 Zeilen runter scrollen" },

	# --- Datei-Ansicht (Spot) ---
	{ on = "<Tab>", run = "spot", desc = "Ausgewählte Datei detailliert anzeigen" },

	# --- Datei-Operationen ---
	{ on = "o",         run = "open",                        desc = "Ausgewählte Dateien öffnen" },
	{ on = "O",         run = "open --interactive",          desc = "Ausgewählte Dateien mit Programmwahl öffnen" },
	{ on = "<Enter>",   run = "open",                        desc = "Ausgewählte Dateien öffnen" },
	{ on = "<S-Enter>", run = "open --interactive",          desc = "Ausgewählte Dateien mit Programmwahl öffnen" },
	{ on = "y",         run = "yank",                        desc = "Ausgewählte Dateien kopieren (yank)" },
	{ on = "x",         run = "yank --cut",                  desc = "Ausgewählte Dateien ausschneiden (cut)" },
	{ on = "p",         run = "paste",                       desc = "Kopierte/ausgeschnittene Dateien einfügen" },
	{ on = "P",         run = "paste --force",               desc = "Einfügen und vorhandene Dateien überschreiben" },
	{ on = "-",         run = "link",                        desc = "Symbolischen Link mit absolutem Pfad erstellen" },
	{ on = "_",         run = "link --relative",             desc = "Symbolischen Link mit relativem Pfad erstellen" },
	{ on = "<C-->",     run = "hardlink",                    desc = "Hardlink für kopierte Dateien erstellen" },
	{ on = "Y",         run = "unyank",                      desc = "Kopier-Status aufheben" },
	{ on = "X",         run = "unyank",                      desc = "Kopier-Status aufheben" },
	{ on = "d",         run = "remove",                      desc = "Ausgewählte Dateien in Papierkorb verschieben" },
	{ on = "D",         run = "remove --permanently",        desc = "Ausgewählte Dateien endgültig löschen" },
	{ on = "a",         run = "create",                      desc = "Datei erstellen (/ am Ende = Verzeichnis)" },
	{ on = "r",         run = "rename --cursor=before_ext",  desc = "Datei umbenennen (Cursor vor Erweiterung)" },
	{ on = ";",         run = "shell --interactive",         desc = "Shell-Befehl ausführen" },
	{ on = ":",         run = "shell --block --interactive", desc = "Shell-Befehl ausführen (blockiert bis fertig)" },
	{ on = ".",         run = "hidden toggle",               desc = "Versteckte Dateien ein-/ausblenden" },
	{ on = "s",         run = "search --via=fd",             desc = "Dateien nach Name suchen (mit fd)" },
	{ on = "S",         run = "search --via=rg",             desc = "Dateien nach Inhalt suchen (mit ripgrep)" },
	{ on = "<C-s>",     run = "escape --search",             desc = "Laufende Suche abbrechen" },
	{ on = "z",         run = "plugin fzf",                  desc = "Zu Datei/Verzeichnis springen (mit fzf)" },
	{ on = "Z",         run = "plugin zoxide",               desc = "Zu Verzeichnis springen (mit zoxide)" },

	# --- Zeilenmodus (Linemode) - Zusätzliche Info in Dateiliste ---
	{ on = [ "m", "s" ], run = "linemode size",        desc = "Zeige Dateigröße" },
	{ on = [ "m", "p" ], run = "linemode permissions", desc = "Zeige Dateiberechtigungen" },
	{ on = [ "m", "b" ], run = "linemode btime",       desc = "Zeige Erstellungszeit" },
	{ on = [ "m", "m" ], run = "linemode mtime",       desc = "Zeige Änderungszeit" },
	{ on = [ "m", "o" ], run = "linemode owner",       desc = "Zeige Besitzer" },
	{ on = [ "m", "n" ], run = "linemode none",        desc = "Keine zusätzliche Info" },

	# --- Kopieren in Zwischenablage ---
	{ on = [ "c", "c" ], run = "copy path",             desc = "Vollständigen Pfad kopieren" },
	{ on = [ "c", "d" ], run = "copy dirname",          desc = "Verzeichnispfad kopieren" },
	{ on = [ "c", "f" ], run = "copy filename",         desc = "Dateinamen kopieren" },
	{ on = [ "c", "n" ], run = "copy name_without_ext", desc = "Dateinamen ohne Erweiterung kopieren" },

	# --- Filtern ---
	{ on = "f", run = "filter --smart", desc = "Dateien filtern (intelligente Suche)" },

	# --- Suchen (Find) ---
	{ on = "/", run = "find --smart",            desc = "Nächste Datei suchen (vorwärts)" },
	{ on = "?", run = "find --previous --smart", desc = "Nächste Datei suchen (rückwärts)" },
	{ on = "n", run = "find_arrow",              desc = "Zum nächsten Suchergebnis springen" },
	{ on = "N", run = "find_arrow --previous",   desc = "Zum vorherigen Suchergebnis springen" },

	# --- Sortierung ---
	{ on = [ ",", "m" ], run = [ "sort mtime --reverse=no", "linemode mtime" ],  desc = "Nach Änderungszeit sortieren" },
	{ on = [ ",", "M" ], run = [ "sort mtime --reverse=yes", "linemode mtime" ], desc = "Nach Änderungszeit sortieren (umgekehrt)" },
	{ on = [ ",", "b" ], run = [ "sort btime --reverse=no", "linemode btime" ],  desc = "Nach Erstellungszeit sortieren" },
	{ on = [ ",", "B" ], run = [ "sort btime --reverse=yes", "linemode btime" ], desc = "Nach Erstellungszeit sortieren (umgekehrt)" },
	{ on = [ ",", "e" ], run = "sort extension --reverse=no",                    desc = "Nach Erweiterung sortieren" },
	{ on = [ ",", "E" ], run = "sort extension --reverse=yes",                   desc = "Nach Erweiterung sortieren (umgekehrt)" },
	{ on = [ ",", "a" ], run = "sort alphabetical --reverse=no",                 desc = "Alphabetisch sortieren" },
	{ on = [ ",", "A" ], run = "sort alphabetical --reverse=yes",                desc = "Alphabetisch sortieren (umgekehrt)" },
	{ on = [ ",", "n" ], run = "sort natural --reverse=no",                      desc = "Natürlich sortieren (1, 2, 10 statt 1, 10, 2)" },
	{ on = [ ",", "N" ], run = "sort natural --reverse=yes",                     desc = "Natürlich sortieren (umgekehrt)" },
	{ on = [ ",", "s" ], run = [ "sort size --reverse=no", "linemode size" ],    desc = "Nach Größe sortieren" },
	{ on = [ ",", "S" ], run = [ "sort size --reverse=yes", "linemode size" ],   desc = "Nach Größe sortieren (umgekehrt)" },
	{ on = [ ",", "r" ], run = "sort random --reverse=no",                       desc = "Zufällig sortieren" },

	# --- Springen zu (Goto) ---
	{ on = [ "g", "h" ],       run = "cd ~",             desc = "Zum Home-Verzeichnis" },
	{ on = [ "g", "c" ],       run = "cd ~/.config",     desc = "Zu ~/.config" },
	{ on = [ "g", "d" ],       run = "cd ~/Downloads",   desc = "Zu ~/Downloads" },
	{ on = [ "g", "<Space>" ], run = "cd --interactive", desc = "Verzeichnis interaktiv auswählen" },
	{ on = [ "g", "f" ],       run = "follow",           desc = "Symbolischem Link folgen" },

	# --- Tabs ---
	{ on = [ "t", "t" ], run = "tab_create --current",     desc = "Neuen Tab im aktuellen Verzeichnis erstellen" },
	{ on = [ "t", "r" ], run = "tab_rename --interactive", desc = "Aktuellen Tab umbenennen" },

	{ on = "1", run = "tab_switch 0", desc = "Zum 1. Tab wechseln" },
	{ on = "2", run = "tab_switch 1", desc = "Zum 2. Tab wechseln" },
	{ on = "3", run = "tab_switch 2", desc = "Zum 3. Tab wechseln" },
	{ on = "4", run = "tab_switch 3", desc = "Zum 4. Tab wechseln" },
	{ on = "5", run = "tab_switch 4", desc = "Zum 5. Tab wechseln" },
	{ on = "6", run = "tab_switch 5", desc = "Zum 6. Tab wechseln" },
	{ on = "7", run = "tab_switch 6", desc = "Zum 7. Tab wechseln" },
	{ on = "8", run = "tab_switch 7", desc = "Zum 8. Tab wechseln" },
	{ on = "9", run = "tab_switch 8", desc = "Zum 9. Tab wechseln" },

	{ on = "[", run = "tab_switch -1 --relative", desc = "Zum vorherigen Tab wechseln" },
	{ on = "]", run = "tab_switch 1 --relative",  desc = "Zum nächsten Tab wechseln" },

	{ on = "{", run = "tab_swap -1", desc = "Aktuellen Tab mit vorherigem tauschen" },
	{ on = "}", run = "tab_swap 1",  desc = "Aktuellen Tab mit nächstem tauschen" },

	# --- Aufgaben-Manager ---
	{ on = "w", run = "tasks:show", desc = "Aufgaben-Manager anzeigen" },

	# --- Hilfe ---
	{ on = "~",    run = "help", desc = "Hilfe öffnen" },
	{ on = "<F1>", run = "help", desc = "Hilfe öffnen" },
]

# ============================================================================
# AUFGABEN-MANAGER (tasks) - Tastenbelegung für laufenden Aufgaben
# ============================================================================
[tasks]

keymap = [
	{ on = "<Esc>", run = "close", desc = "Aufgaben-Manager schließen" },
	{ on = "<C-[>", run = "close", desc = "Aufgaben-Manager schließen" },
	{ on = "<C-c>", run = "close", desc = "Aufgaben-Manager schließen" },
	{ on = "w",     run = "close", desc = "Aufgaben-Manager schließen" },

	{ on = "k", run = "arrow prev", desc = "Vorherige Aufgabe" },
	{ on = "j", run = "arrow next", desc = "Nächste Aufgabe" },

	{ on = "<Up>",   run = "arrow prev", desc = "Vorherige Aufgabe" },
	{ on = "<Down>", run = "arrow next", desc = "Nächste Aufgabe" },

	{ on = "<Enter>", run = "inspect", desc = "Aufgabe inspizieren" },
	{ on = "x",       run = "cancel",  desc = "Aufgabe abbrechen" },

	# Hilfe
	{ on = "~",    run = "help", desc = "Hilfe öffnen" },
	{ on = "<F1>", run = "help", desc = "Hilfe öffnen" },
]

# ============================================================================
# SPOT (spot) - Detaillierte Dateiansicht
# ============================================================================
[spot]

keymap = [
	{ on = "<Esc>", run = "close", desc = "Spot-Ansicht schließen" },
	{ on = "<C-[>", run = "close", desc = "Spot-Ansicht schließen" },
	{ on = "<C-c>", run = "close", desc = "Spot-Ansicht schließen" },
	{ on = "<Tab>", run = "close", desc = "Spot-Ansicht schließen" },

	{ on = "k", run = "arrow prev", desc = "Vorherige Zeile" },
	{ on = "j", run = "arrow next", desc = "Nächste Zeile" },
	{ on = "h", run = "swipe prev", desc = "Zur vorherigen Datei wechseln" },
	{ on = "l", run = "swipe next", desc = "Zur nächsten Datei wechseln" },

	{ on = "<Up>",    run = "arrow prev", desc = "Vorherige Zeile" },
	{ on = "<Down>",  run = "arrow next", desc = "Nächste Zeile" },
	{ on = "<Left>",  run = "swipe prev", desc = "Zur vorherigen Datei wechseln" },
	{ on = "<Right>", run = "swipe next", desc = "Zur nächsten Datei wechseln" },

	# Kopieren
	{ on = [ "c", "c" ], run = "copy cell", desc = "Ausgewählte Zelle kopieren" },

	# Hilfe
	{ on = "~",    run = "help", desc = "Hilfe öffnen" },
	{ on = "<F1>", run = "help", desc = "Hilfe öffnen" },
]

# ============================================================================
# AUSWAHL (pick) - Programm-Auswahl
# ============================================================================
[pick]

keymap = [
	{ on = "<Esc>",   run = "close",          desc = "Auswahl abbrechen" },
	{ on = "<C-[>",   run = "close",          desc = "Auswahl abbrechen" },
	{ on = "<C-c>",   run = "close",          desc = "Auswahl abbrechen" },
	{ on = "<Enter>", run = "close --submit", desc = "Auswahl bestätigen" },

	{ on = "k", run = "arrow prev", desc = "Vorherige Option" },
	{ on = "j", run = "arrow next", desc = "Nächste Option" },

	{ on = "<Up>",   run = "arrow prev", desc = "Vorherige Option" },
	{ on = "<Down>", run = "arrow next", desc = "Nächste Option" },

	# Hilfe
	{ on = "~",    run = "help", desc = "Hilfe öffnen" },
	{ on = "<F1>", run = "help", desc = "Hilfe öffnen" },
]

# ============================================================================
# EINGABE (input) - Vim-ähnliche Eingabezeile
# ============================================================================
[input]

keymap = [
	{ on = "<C-c>",   run = "close",          desc = "Eingabe abbrechen" },
	{ on = "<Enter>", run = "close --submit", desc = "Eingabe bestätigen" },
	{ on = "<Esc>",   run = "escape",         desc = "Zurück zum Normal-Modus oder abbrechen" },
	{ on = "<C-[>",   run = "escape",         desc = "Zurück zum Normal-Modus oder abbrechen" },

	# Modi (wie in Vim)
	{ on = "i", run = "insert",                          desc = "Insert-Modus (Einfügen)" },
	{ on = "I", run = [ "move first-char", "insert" ],   desc = "Zum Zeilenanfang und Insert-Modus" },
	{ on = "a", run = "insert --append",                 desc = "Append-Modus (Anhängen)" },
	{ on = "A", run = [ "move eol", "insert --append" ], desc = "Zum Zeilenende und Append-Modus" },
	{ on = "v", run = "visual",                          desc = "Visuellen Modus starten" },
	{ on = "r", run = "replace",                         desc = "Einzelnes Zeichen ersetzen" },

	# Auswahl (visueller Modus)
	{ on = "V",     run = [ "move bol", "visual", "move eol" ], desc = "Ganze Zeile auswählen" },
	{ on = "<C-A>", run = [ "move eol", "visual", "move bol" ], desc = "Von Ende bis Anfang auswählen" },
	{ on = "<C-E>", run = [ "move bol", "visual", "move eol" ], desc = "Von Anfang bis Ende auswählen" },

	# Zeichenweise Bewegung
	{ on = "h",       run = "move -1", desc = "Ein Zeichen zurück" },
	{ on = "l",       run = "move 1",  desc = "Ein Zeichen vor" },
	{ on = "<Left>",  run = "move -1", desc = "Ein Zeichen zurück" },
	{ on = "<Right>", run = "move 1",  desc = "Ein Zeichen vor" },
	{ on = "<C-b>",   run = "move -1", desc = "Ein Zeichen zurück" },
	{ on = "<C-f>",   run = "move 1",  desc = "Ein Zeichen vor" },

	# Wortweise Bewegung
	{ on = "b",         run = "backward",                    desc = "Zum Anfang des aktuellen/vorherigen Wortes" },
	{ on = "B",         run = "backward --far",              desc = "Zum Anfang des aktuellen/vorherigen WORD" },
	{ on = "w",         run = "forward",                     desc = "Zum Anfang des nächsten Wortes" },
	{ on = "W",         run = "forward --far",               desc = "Zum Anfang des nächsten WORD" },
	{ on = "e",         run = "forward --end-of-word",       desc = "Zum Ende des aktuellen/nächsten Wortes" },
	{ on = "E",         run = "forward --far --end-of-word", desc = "Zum Ende des aktuellen/nächsten WORD" },
	{ on = "<A-b>",     run = "backward",                    desc = "Zum Anfang des aktuellen/vorherigen Wortes" },
	{ on = "<A-f>",     run = "forward --end-of-word",       desc = "Zum Ende des aktuellen/nächsten Wortes" },
	{ on = "<C-Left>",  run = "backward",                    desc = "Zum Anfang des aktuellen/vorherigen Wortes" },
	{ on = "<C-Right>", run = "forward --end-of-word",       desc = "Zum Ende des aktuellen/nächsten Wortes" },

	# Zeilenweise Bewegung
	{ on = "0",      run = "move bol",        desc = "Zum Zeilenanfang (BOL)" },
	{ on = "$",      run = "move eol",        desc = "Zum Zeilenende (EOL)" },
	{ on = "_",      run = "move first-char", desc = "Zum ersten Nicht-Leerzeichen" },
	{ on = "^",      run = "move first-char", desc = "Zum ersten Nicht-Leerzeichen" },
	{ on = "<C-a>",  run = "move bol",        desc = "Zum Zeilenanfang (BOL)" },
	{ on = "<C-e>",  run = "move eol",        desc = "Zum Zeilenende (EOL)" },
	{ on = "<Home>", run = "move bol",        desc = "Zum Zeilenanfang (BOL)" },
	{ on = "<End>",  run = "move eol",        desc = "Zum Zeilenende (EOL)" },

	# Löschen
	{ on = "<Backspace>", run = "backspace",         desc = "Zeichen vor Cursor löschen" },
	{ on = "<Delete>",    run = "backspace --under", desc = "Zeichen unter Cursor löschen" },
	{ on = "<C-h>",       run = "backspace",         desc = "Zeichen vor Cursor löschen" },
	{ on = "<C-d>",       run = "backspace --under", desc = "Zeichen unter Cursor löschen" },

	# Kill (wie in Emacs/Vim)
	{ on = "<C-u>",         run = "kill bol",      desc = "Bis Zeilenanfang löschen" },
	{ on = "<C-k>",         run = "kill eol",      desc = "Bis Zeilenende löschen" },
	{ on = "<C-w>",         run = "kill backward", desc = "Bis Wortanfang rückwärts löschen" },
	{ on = "<A-d>",         run = "kill forward",  desc = "Bis Wortende vorwärts löschen" },
	{ on = "<C-Backspace>", run = "kill backward", desc = "Bis Wortanfang rückwärts löschen" },
	{ on = "<C-Delete>",    run = "kill forward",  desc = "Bis Wortende vorwärts löschen" },

	# Ausschneiden/Kopieren/Einfügen
	{ on = "d", run = "delete --cut",                                      desc = "Ausgewählte Zeichen ausschneiden" },
	{ on = "D", run = [ "delete --cut", "move eol" ],                      desc = "Bis Zeilenende ausschneiden" },
	{ on = "c", run = "delete --cut --insert",                             desc = "Ausgewählte Zeichen ausschneiden und einfügen" },
	{ on = "C", run = [ "delete --cut --insert", "move eol" ],             desc = "Bis Zeilenende ausschneiden und einfügen" },
	{ on = "s", run = [ "delete --cut --insert", "move 1" ],               desc = "Aktuelles Zeichen ausschneiden und einfügen" },
	{ on = "S", run = [ "move bol", "delete --cut --insert", "move eol" ], desc = "Ganze Zeile ausschneiden und einfügen" },
	{ on = "x", run = [ "delete --cut", "move 1 --in-operating" ],         desc = "Aktuelles Zeichen ausschneiden" },
	{ on = "y", run = "yank",                                              desc = "Ausgewählte Zeichen kopieren" },
	{ on = "p", run = "paste",                                             desc = "Nach Cursor einfügen" },
	{ on = "P", run = "paste --before",                                    desc = "Vor Cursor einfügen" },

	# Undo/Redo/Groß-/Kleinschreibung
	{ on = "u",     run = [ "undo", "casefy lower" ], desc = "Rückgängig oder Kleinbuchstaben (im visuellen Modus)" },
	{ on = "U",     run = "casefy upper",             desc = "Großbuchstaben" },
	{ on = "<C-r>", run = "redo",                     desc = "Letzte Operation wiederherstellen" },

	# Hilfe
	{ on = "~",    run = "help", desc = "Hilfe öffnen" },
	{ on = "<F1>", run = "help", desc = "Hilfe öffnen" },
]

# ============================================================================
# BESTÄTIGUNG (confirm) - Ja/Nein-Dialoge
# ============================================================================
[confirm]

keymap = [
	{ on = "<Esc>",   run = "close",          desc = "Bestätigung abbrechen" },
	{ on = "<C-[>",   run = "close",          desc = "Bestätigung abbrechen" },
	{ on = "<C-c>",   run = "close",          desc = "Bestätigung abbrechen" },
	{ on = "<Enter>", run = "close --submit", desc = "Bestätigung bestätigen" },

	{ on = "n", run = "close",          desc = "Nein / Abbrechen" },
	{ on = "y", run = "close --submit", desc = "Ja / Bestätigen" },

	{ on = "k", run = "arrow prev", desc = "Vorherige Zeile" },
	{ on = "j", run = "arrow next", desc = "Nächste Zeile" },

	{ on = "<Up>",   run = "arrow prev", desc = "Vorherige Zeile" },
	{ on = "<Down>", run = "arrow next", desc = "Nächste Zeile" },

	# Hilfe
	{ on = "~",    run = "help", desc = "Hilfe öffnen" },
	{ on = "<F1>", run = "help", desc = "Hilfe öffnen" },
]

# ============================================================================
# AUTOVERVOLLSTÄNDIGUNG (cmp) - Completion-Menü
# ============================================================================
[cmp]

keymap = [
	{ on = "<C-c>",   run = "close",                                      desc = "Autovervollständigung abbrechen" },
	{ on = "<Tab>",   run = "close --submit",                             desc = "Autovervollständigung übernehmen" },
	{ on = "<Enter>", run = [ "close --submit", "input:close --submit" ], desc = "Übernehmen und Eingabe bestätigen" },

	{ on = "<A-k>", run = "arrow prev", desc = "Vorheriger Eintrag" },
	{ on = "<A-j>", run = "arrow next", desc = "Nächster Eintrag" },

	{ on = "<Up>",   run = "arrow prev", desc = "Vorheriger Eintrag" },
	{ on = "<Down>", run = "arrow next", desc = "Nächster Eintrag" },

	{ on = "<C-p>", run = "arrow prev", desc = "Vorheriger Eintrag" },
	{ on = "<C-n>", run = "arrow next", desc = "Nächster Eintrag" },

	# Hilfe
	{ on = "~",    run = "help", desc = "Hilfe öffnen" },
	{ on = "<F1>", run = "help", desc = "Hilfe öffnen" },
]

# ============================================================================
# HILFE (help) - Integrierte Hilfe-Ansicht
# ============================================================================
[help]

keymap = [
	{ on = "<Esc>", run = "escape", desc = "Filter löschen oder Hilfe schließen" },
	{ on = "<C-[>", run = "escape", desc = "Filter löschen oder Hilfe schließen" },
	{ on = "<C-c>", run = "close",  desc = "Hilfe schließen" },

	# Navigation
	{ on = "k", run = "arrow prev", desc = "Vorherige Zeile" },
	{ on = "j", run = "arrow next", desc = "Nächste Zeile" },

	{ on = "<Up>",   run = "arrow prev", desc = "Vorherige Zeile" },
	{ on = "<Down>", run = "arrow next", desc = "Nächste Zeile" },

	# Filtern
	{ on = "f", run = "filter", desc = "Hilfe-Einträge filtern" },
]
